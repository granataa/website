:root {
  --paper: #eceeea; --panel: #dfe3de; --ink: #15191c; --muted: #59616a;
  --rule: #c6cbc5; --accent: #a85a0c; --signal: #d98a1f;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101416; --panel: #182024; --ink: #e5e8e3; --muted: #98a2a8;
    --rule: #2b3438; --accent: #f0ae48; --signal: #f0ae48; color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 17px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
.wrap {
  width: 100%; max-width: 920px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
main { flex: 1; display: flex; align-items: center; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 48px; }
.eyebrow { font: 500 12px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.eyebrow span { white-space: nowrap; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(3.2rem, 13vw, 8.5rem); line-height: .86; text-wrap: balance;
}
.scope { display: grid; gap: 8px; }
canvas { display: block; width: 100%; height: 72px; background: #000a24; }
.cap { font: 400 12px/1.3 var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status { display: grid; gap: 4px; }
.status p { margin: 0; max-width: 46ch; }
.status .en { color: var(--muted); font-size: 15px; }
footer { border-top: 1px solid var(--rule); }
footer .wrap {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  font: 400 12.5px/1.4 var(--f-mono); color: var(--muted);
}
.call { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<main>
  <div class="wrap hero">
    <div class="eyebrow"><span>Ingegnere informatico</span> · <span>Consulente IT</span> · <span>Calabria</span></div>
    <h1>Alessandro<br>Granata</h1>
    <div class="scope">
      <canvas id="wf" aria-hidden="true"></canvas>
      <div class="cap"><span>Waterfall · 40 m</span><span>CW · IU8DKG</span></div>
    </div>
    <div class="status">
      <p>Il sito è in costruzione. Torna a trovarmi tra qualche giorno.</p>
      <p class="en" lang="en">Site under construction. Please check back in a few days.</p>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>alessandrogranata.it</span>
    <span>73 de <span class="call">IU8DKG</span></span>
  </div>
</footer>
<script>
(function () {
  var c = document.getElementById("wf"), ctx = c.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLS = 200, ROWS = 48, vals = new Float32Array(COLS * ROWS);
  var off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
  var octx = off.getContext("2d"), img = octx.createImageData(COLS, ROWS);
  var lut = new Uint8ClampedArray(768);
  function rgb(h) { h = h.trim().replace("#", ""); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  /* Classic SDR waterfall palette: navy noise floor, blue, cyan, yellow, red peaks */
  var STOPS = [[0, "#000a24"], [0.2, "#06246e"], [0.38, "#1257c9"], [0.55, "#18b7e0"], [0.72, "#f2e22e"], [0.86, "#f07a12"], [1, "#d8141c"]];
  function buildLut() {
    for (var i = 0; i < 256; i++) {
      var v = i / 255, s = 0;
      while (s < STOPS.length - 2 && v > STOPS[s + 1][0]) s++;
      var p = rgb(STOPS[s][1]), q = rgb(STOPS[s + 1][1]);
      var k = (v - STOPS[s][0]) / (STOPS[s + 1][0] - STOPS[s][0]);
      for (var j = 0; j < 3; j++) lut[i * 3 + j] = p[j] + (q[j] - p[j]) * k;
    }
  }
  var morse = { I: "..", U: "..-", "8": "---..", D: "-..", K: "-.-", G: "--." }, key = [];
  "IU8DKG".split("").forEach(function (ch) {
    morse[ch].split("").forEach(function (s) { for (var i = 0; i < (s === "." ? 1 : 3); i++) key.push(1); key.push(0); });
    key.push(0, 0);
  });
  for (var g = 0; g < 7; g++) key.push(0);
  var pos = 0, carriers = [34, 52, 61, 170];
  function row() {
    vals.copyWithin(COLS, 0, COLS * (ROWS - 1));
    var on = key[Math.floor(pos / 2) % key.length] === 1; pos++;
    for (var x = 0; x < COLS; x++) {
      var v = Math.random() * 0.22 + 0.05;
      for (var i = 0; i < carriers.length; i++) {
        var dc = Math.abs(x - carriers[i]);
        if (dc < 2) v += (dc === 0 ? 0.42 : 0.18) + Math.random() * 0.12;
      }
      var cw = Math.abs(x - 122);
      if (on && cw < 3) v += cw === 0 ? 0.95 : cw === 1 ? 0.7 : 0.35;
      vals[x] = Math.min(1, v);
    }
  }
  function size() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr);
  }
  function paint() {
    var d = img.data;
    for (var i = 0; i < vals.length; i++) {
      var li = (vals[i] * 255 | 0) * 3;
      d[i * 4] = lut[li]; d[i * 4 + 1] = lut[li + 1]; d[i * 4 + 2] = lut[li + 2]; d[i * 4 + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, c.width, c.height);
  }
  buildLut(); size();
  for (var r = 0; r < ROWS; r++) row();
  paint();
  window.addEventListener("resize", function () { size(); paint(); });
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", function () { buildLut(); paint(); });
  if (!reduce) setInterval(function () { row(); paint(); }, 60);
})();
</script>
